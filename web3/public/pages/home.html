<div class="page page-home">
  <section class="hero">
    <div class="hero-owl" id="home-owl"></div>
    <div class="hero-words">
      <h1 data-t="title"></h1>
      <p data-t="lead"></p>
      <div class="hero-go">
        <a class="button" href="/teach" data-t="go"></a>
      </div>
    </div>
  </section>

  <div class="steps">
    <a class="step step-teach" href="/teach">
      <span class="step-n">1</span>
      <svg viewBox="0 0 120 80" aria-hidden="true">
        <path class="rail" d="M30 76 V8 M90 76 V8"/>
        <path class="rung" d="M30 62 H90 M30 44 H90 M30 26 H90"/>
        <circle class="dot" cx="60" cy="62" r="7"/><circle class="dot d2" cx="60" cy="44" r="7"/><circle class="dot d3" cx="60" cy="26" r="7"/>
      </svg>
      <h2 data-t="teach_h"></h2>
      <p data-t="teach_p"></p>
    </a>
    <a class="step step-reason" href="/reason">
      <span class="step-n">2</span>
      <svg viewBox="0 0 120 80" aria-hidden="true">
        <rect class="sheet" x="10" y="12" width="44" height="56" rx="6"/>
        <path class="ink" d="M18 26 H46 M18 36 H40 M18 46 H46 M18 56 H34"/>
        <path class="arrow" d="M60 40 H78 M72 33 L79 40 L72 47"/>
        <circle class="answer" cx="98" cy="40" r="17"/><text x="98" y="48" text-anchor="middle">C</text>
      </svg>
      <h2 data-t="reason_h"></h2>
      <p data-t="reason_p"></p>
    </a>
    <a class="step step-stats" href="/stats">
      <span class="step-n">3</span>
      <svg viewBox="0 0 120 80" aria-hidden="true">
        <path class="axis" d="M12 70 H110"/>
        <rect class="bar" x="20" y="44" width="16" height="26" rx="3"/><rect class="bar" x="44" y="38" width="16" height="32" rx="3"/>
        <rect class="bar" x="68" y="46" width="16" height="24" rx="3"/><rect class="bar best" x="92" y="20" width="16" height="50" rx="3"/>
        <path class="chance" d="M12 48 H110"/>
      </svg>
      <h2 data-t="stats_h"></h2>
      <p data-t="stats_p"></p>
    </a>
  </div>

</div>
